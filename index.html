<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<title>Allen Field Radio</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #0b0c0e; --edge: #050607;
    --metal-hi: #2c3036; --metal: #1f2226; --metal-lo: #16181b;
    --lcd: #0c0f11; --lcd-ink: #e3e7ea; --lcd-dim: #7f8992; --lcd-line: #2a3036;
    --pad: #8a6b52; --pad-lo: #6e5440; --pad-ink: #2b1f15;
    --green: #3ddc6a; --red: #ff3b30; --amber: #ffb020; --orange: #ff6a13;
    --label: #8d959e;
    --mono: "Share Tech Mono", ui-monospace, monospace;
    --cond: "Saira Semi Condensed", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--lcd-ink); font-family: var(--cond); background-color: var(--page);
    background-image: repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.025) 23px 24px),
                      repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.025) 23px 24px); }
  body { min-height: 100dvh; display: flex; justify-content: center; padding: 18px 10px 28px; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* ---------- Chassis ---------- */
  .radio { width: 100%; max-width: 460px; position: relative; padding-top: 26px; }
  .antenna { position: absolute; top: 0; left: 64px; width: 16px; height: 46px; border-radius: 6px 6px 2px 2px;
    background: repeating-linear-gradient(0deg, #0d0e10 0 3px, #2a2d32 3px 6px); box-shadow: 0 0 0 2px #0a0b0c; }
  .chassis { position: relative; border-radius: 26px; padding: 16px 20px 14px; border: 2px solid var(--edge);
    background: linear-gradient(180deg, var(--metal-hi), var(--metal) 18%, var(--metal-lo));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.5), 0 24px 50px rgba(0,0,0,.7); }
  .bumper { position: absolute; width: 58px; height: 58px; background:
      repeating-linear-gradient(135deg, #1a1c1f 0 4px, #2c2f34 4px 7px); border: 2px solid var(--edge); }
  .bumper.tl { top: -8px; left: -8px; border-radius: 26px 0 30px 0; }
  .bumper.tr { top: -8px; right: -8px; border-radius: 0 26px 0 30px; }
  .bumper.bl { bottom: -8px; left: -8px; border-radius: 0 30px 0 26px; }
  .bumper.br { bottom: -8px; right: -8px; border-radius: 30px 0 26px 0; }
  .grip { position: absolute; top: 160px; bottom: 120px; width: 8px;
    background: repeating-linear-gradient(0deg, #0c0d0f 0 6px, #2a2d32 6px 12px); border-radius: 3px; }
  .grip.l { left: -6px; } .grip.r { right: -6px; }

  .plate { position: relative; display: flex; justify-content: center; align-items: center; padding: 14px 0 12px;
    margin: 0 18px; border-radius: 12px; background: linear-gradient(180deg, #24272c, #1b1d21);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.05); }
  .plate img { width: min(180px, 46vw); height: auto; opacity: .92; }
  .led-wrap { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); text-align: center;
    font: 700 9px var(--cond); letter-spacing: .2em; color: var(--label); }
  .led { display: block; margin: 0 auto 4px; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2b2f34, #0d0f11); box-shadow: inset 0 1px 3px #000, 0 0 0 2px #121417; }
  .led.rx { background: radial-gradient(circle at 40% 35%, #9dffb8, var(--green)); box-shadow: 0 0 12px var(--green), 0 0 0 2px #121417; }
  .led.tx { background: radial-gradient(circle at 40% 35%, #ffb3ad, var(--red)); box-shadow: 0 0 12px var(--red), 0 0 0 2px #121417; }

  .grille { height: 64px; margin: 16px 2px; border-radius: 14px; background-color: #0a0b0d;
    background-image: radial-gradient(circle, #000 0 2.6px, transparent 3px);
    background-size: 12px 12px; background-position: 4px 4px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05); }

  /* ---------- LCD ---------- */
  .lcd { position: relative; overflow: hidden; border-radius: 12px; padding: 14px 16px; background: var(--lcd);
    border: 3px solid #08090a; box-shadow: inset 0 0 22px rgba(0,0,0,.9), 0 0 0 1px #2c3036; }
  .lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.035) 46%, transparent 56%); }
  .lbl { font: 13px var(--mono); letter-spacing: .14em; color: var(--lcd-dim); text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  /* Join form */
  .field { padding: 8px 0 10px; border-bottom: 1px dashed #4a525a; margin-bottom: 14px; }
  .field .val { font: 24px var(--mono); letter-spacing: .08em; margin-top: 4px; text-transform: uppercase; }
  input.name { width: 100%; margin-top: 4px; background: transparent; border: 0; outline: 0; padding: 0; color: var(--lcd-ink);
    font: 24px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  input.name::placeholder { color: #3f474e; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .lang { padding: 12px 6px; border-radius: 8px; border: 1px solid #3a4148; background: #111518;
    font: 18px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lcd-dim); }
  .lang.on { color: var(--lcd-ink); border-color: var(--lcd-ink); box-shadow: inset 0 0 12px rgba(255,255,255,.08); }
  .lang.on::before { content: "▸ "; }
  .power { width: 100%; margin-top: 6px; padding: 16px 10px; border-radius: 8px; border: 1px solid #8a939b; background: #12161a;
    font: 19px var(--mono); letter-spacing: .14em; color: var(--lcd-ink); white-space: nowrap; }
  .power:active { background: #1b2126; }
  .err { font: 14px var(--mono); color: var(--amber); min-height: 18px; margin-top: 10px; }

  /* Roster */
  .chips { margin: 10px 0 2px; }
  .chip { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font: 20px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b545c; flex: none; align-self: center; }
  .chip .nm { flex: none; }
  .chip .lead { flex: 1; border-bottom: 1px dotted #39414a; transform: translateY(-5px); }
  .chip .lg { font-size: 15px; color: var(--lcd-dim); }
  .chip.me .dot { background: var(--orange); }
  .chip:not(.me) .dot { background: var(--green); }
  .chip.live { color: var(--green); }
  .chip.live .lg { color: var(--green); }
  .chip.live .lg::after { content: " · TX"; animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .alone { font: 14px var(--mono); color: var(--lcd-dim); margin-top: 4px; }

  /* Caption */
  .divider { border-top: 1px dashed #3d454d; margin: 12px 0; }
  .card { min-height: 104px; }
  .cap-empty { font: 15px var(--mono); color: #4d565e; text-align: center; padding: 26px 0 10px; letter-spacing: .06em; }
  .cap-who { font: 13px var(--mono); letter-spacing: .14em; color: var(--lcd-dim); text-transform: uppercase; }
  .cap-main { font: 600 27px/1.2 var(--cond); margin-top: 4px; color: #f4f6f7; word-wrap: break-word; }
  .cap-sub { font: 15px var(--mono); color: var(--lcd-dim); margin-top: 8px; word-wrap: break-word; }
  .badge { display: inline-block; font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--amber); color: #000; margin-left: 6px; }
  .lcd.flash { animation: flash .35s steps(1) 5; }
  @keyframes flash { 0% { background: #a1120a; } 50% { background: var(--lcd); } }

  /* ---------- Talk pad ---------- */
  .pad-bay { margin: 16px 0 12px; padding: 12px; border-radius: 16px; background: #121417; position: relative;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.05); }
  .screw { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #555b62, #1c1f22);
    box-shadow: inset 0 0 0 1px #0a0b0c; }
  .screw::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1px; background: #0a0b0c; transform: rotate(35deg); }
  .screw.a { top: 7px; left: 7px; } .screw.b { top: 7px; right: 7px; } .screw.c { bottom: 7px; left: 7px; } .screw.d { bottom: 7px; right: 7px; }
  .talk { width: 100%; min-height: 172px; border-radius: 12px; border: 2px solid #3a2b1f; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; color: var(--pad-ink); font: 800 50px var(--cond); letter-spacing: .28em; text-indent: .28em;
    background-color: var(--pad);
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.09) 0 2px, transparent 2px 7px),
                      repeating-linear-gradient(-45deg, rgba(0,0,0,.09) 0 2px, transparent 2px 7px),
                      linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.18));
    box-shadow: 0 6px 0 #3d2d20, inset 0 1px 0 rgba(255,255,255,.2); text-shadow: 0 1px 0 rgba(255,255,255,.25);
    transition: transform .05s, box-shadow .05s; }
  .talk small { display: block; font: 700 12px var(--cond); letter-spacing: .14em; text-indent: .14em; margin-top: 10px; opacity: .8; white-space: nowrap; }
  .talk.on { background-color: #b3291b; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.45);
    transform: translateY(5px); box-shadow: 0 1px 0 #3d2d20, 0 0 28px rgba(255,59,48,.55), inset 0 1px 0 rgba(255,255,255,.2); }
  .talk:disabled { filter: grayscale(.8) brightness(.55); }

  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .preset { position: relative; min-height: 56px; border-radius: 10px; border: 2px solid #08090a; color: #fff; font: 800 16px var(--cond); letter-spacing: .08em; }
  .preset.wide { grid-column: span 2; }
  .preset .dot { position: absolute; top: 6px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }

  /* ---------- Log ---------- */
  .history:empty { display: none; }
  .history { padding: 8px 14px; max-height: 220px; overflow-y: auto; }
  .history::before { content: "LOG"; display: block; font: 12px var(--mono); letter-spacing: .2em; color: var(--lcd-dim); margin: 2px 0 4px; }
  .item { border-top: 1px dashed #2b3238; padding: 8px 0; }
  .item .t { font: 12px var(--mono); color: var(--lcd-dim); letter-spacing: .08em; text-transform: uppercase; }
  .item .m { font: 600 18px var(--cond); margin-top: 2px; }
  .item .s { font: 13px var(--mono); color: var(--lcd-dim); }
  .item.alarm .m { color: #ff7a70; }

  /* ---------- Controls & plate ---------- */
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding: 0 4px; }
  .switch { display: flex; align-items: center; gap: 10px; font: 700 12px var(--cond); letter-spacing: .16em; color: var(--label); white-space: nowrap; }
  .switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 24px; border-radius: 12px; margin: 0; position: relative;
    background: #0c0e10; box-shadow: inset 0 2px 4px #000, 0 0 0 1px #2e3338; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(180deg, #6b727a, #3b4046); transition: left .15s; }
  .switch input:checked { background: #10331c; }
  .switch input:checked::after { left: 25px; background: linear-gradient(180deg, #8ef0a9, var(--green)); }
  .linkbtn { background: none; border: 1px solid #353a40; border-radius: 8px; padding: 8px 10px; font: 700 12px var(--cond); letter-spacing: .14em; color: var(--label); white-space: nowrap; }
  .fine { font: 11px var(--mono); color: #5d666e; text-align: center; margin-top: 14px; letter-spacing: .04em; }
  .model { text-align: center; font: 700 11px var(--cond); letter-spacing: .22em; color: #4f565d; margin-top: 12px; white-space: nowrap; }
  .diag { font: 10px var(--mono); color: #454c53; text-align: center; margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000; color: var(--lcd-ink);
    border: 1px solid #3a4148; border-radius: 10px; padding: 10px 14px; font: 14px var(--mono); z-index: 30; max-width: 92vw; }
</style>
</head>
<body>

<div class="radio">
  <div class="antenna"></div>
  <div class="chassis">
    <span class="bumper tl"></span><span class="bumper tr"></span><span class="bumper bl"></span><span class="bumper br"></span>
    <span class="grip l"></span><span class="grip r"></span>

    <div class="plate">
      <img src="allen-logo-white.png" alt="The Allen Company">
      <div class="led-wrap"><i class="led" id="busyLed"></i>BUSY</div>
    </div>
    <div class="grille"></div>

    <!-- ===================== JOIN ===================== -->
    <section id="joinView">
      <div class="lcd">
        <div class="field"><div class="lbl">Channel</div><div class="val" id="joinChannel"></div></div>
        <div class="field"><label class="lbl" for="joinName">Callsign / Nombre</label>
          <input class="name" id="joinName" maxlength="20" autocomplete="name" placeholder="YOUR NAME"></div>
        <div class="lbl">Language / Idioma</div>
        <div class="langs" id="langButtons"></div>
        <div style="height:16px"></div>
        <button class="power" id="joinBtn">▶ POWER ON / JOIN</button>
        <div class="err" id="joinErr"></div>
      </div>
    </section>

    <!-- ===================== RADIO ===================== -->
    <main id="radioView" class="hidden">
      <div class="lcd" id="card">
        <div class="row"><span class="lbl" id="rosterTitle">Connecting…</span><span class="lbl" id="rosterCount"></span></div>
        <div class="chips" id="chips"></div>
        <div class="alone hidden" id="alone">No one else on yet / Nadie más conectado</div>
        <div class="divider"></div>
        <div class="cap-empty" id="capEmpty">TRANSLATIONS SHOW HERE<br>LAS TRADUCCIONES APARECEN AQUÍ</div>
        <div class="cap-who" id="capWho"></div>
        <div class="cap-main" id="capMain"></div>
        <div class="cap-sub" id="capSub"></div>
      </div>

      <div class="pad-bay">
        <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
        <button class="talk" id="talk"></button>
      </div>

      <div class="presets hidden" id="presets"></div>

      <div class="lcd history" id="log"></div>

      <div class="controls">
        <label class="switch"><input type="checkbox" id="speakToggle"> READ ALOUD</label>
        <button class="linkbtn" id="changeBtn">CHANGE NAME</button>
      </div>
      <div class="fine">Translations are an aid and can be wrong · Las traducciones pueden tener errores</div>
    </main>

    <div class="model">MDL AFR-2 · ALLEN FIELD RADIO</div>
    <div class="diag" id="diag"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  channel: "ALLEN-MAIN",      // everyone joins this one channel for now
  peerPrefix: "allen-field-radio",
  maxSlots: 12,
  peerOptions: { debug: 0 },
  maxTalkSeconds: 30,         // a forgotten open mic stops itself

  // Model, translation prompt and glossary live in netlify/functions/translate.mjs.
  translate: {
    endpoint: "/.netlify/functions/translate",
    sttEndpoint: "/.netlify/functions/stt",
    timeoutMs: 5000,
    sttTimeoutMs: 9000,
  },

  // Caption engine: "auto" tries the phone's speech recognition and falls back to the
  // server (stt function) if it is missing or conflicts with the radio mic.
  sttDefault: "auto",
  iosServerCaptions: false,

  // English and Spanish only. Spanish is neutral Latin American (crews from Mexico, Guatemala, Honduras).
  languages: [
    { code: "en-US", label: "English", short: "EN" },
    { code: "es-US", label: "Español", short: "ES" },
  ],

  // Safety buttons are hidden for the simple version. Set true to bring the row back.
  // Set verified: true only after the bilingual crew review.
  showPresets: false,
  presets: [
    { key: "STOP", icon: "✋", color: "#d0021b", alarm: true, wide: true, verified: false,
      text: { "en-US": "Stop! Stop now!", "es-US": "¡Alto! ¡Deténgase ya!" } },
    { key: "SLOW", icon: "🐢", color: "#e08a00", verified: false,
      text: { "en-US": "Slow down.", "es-US": "Más despacio." } },
    { key: "HOLD TRAFFIC", icon: "🚧", color: "#c25e00", verified: false,
      text: { "en-US": "Hold traffic.", "es-US": "Detengan el tráfico." } },
    { key: "CLEAR / GO", icon: "✅", color: "#1f8a3b", verified: false,
      text: { "en-US": "Clear. Go ahead.", "es-US": "Libre. Adelante." } },
    { key: "TRUCK COMING", icon: "🚚", color: "#2a62c9", verified: false,
      text: { "en-US": "Truck coming.", "es-US": "Viene un camión." } },
    { key: "BACK UP", icon: "↩️", color: "#6b3fb5", verified: false,
      text: { "en-US": "Back up.", "es-US": "Échese para atrás." } },
    { key: "EMERGENCY", icon: "🚨", color: "#8f0010", alarm: true, wide: true, verified: false,
      text: { "en-US": "Emergency! Stop work. Call 911.", "es-US": "¡Emergencia! Paren el trabajo. Llamen al 911." } },
  ],

  captionLogSize: 10,
};

/* =====================================================================
   STATE
   ===================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem("afr." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("afr." + k, JSON.stringify(v)); } catch {} },
};

const S = {
  name: store.get("name", ""), channel: CONFIG.channel,
  lang: store.get("lang", "en-US"),
  speak: store.get("speak", true),
  sttMode: CONFIG.sttDefault,
  sttConflict: store.get("sttConflict", false),
  peer: null, myId: "", slot: 0, joined: false,
  audioCtx: null, micStream: null, micTrack: null, outStream: null, listenOnly: false, analyser: null,
  peers: new Map(),            // peerId -> { id, name, lang, call, conn, outCall, outConn, audio, talking }
  transmitting: false, talkTimer: null, capture: null,
  log: [], speechQueue: [], speaking: false, lastLatency: null,
};

const allLanguages = () => CONFIG.languages;
const langInfo = (code) => allLanguages().find((l) => l.code === code)
  || { code, label: code, short: String(code || "?").toUpperCase() };
const presetByKey = (key) => CONFIG.presets.find((p) => p.key === key);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "main";
const clip = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (/^es/.test(S.lang)) S.lang = "es-US"; // earlier builds had per-country Spanish
if (!allLanguages().some((l) => l.code === S.lang)) S.lang = "en-US";

/* =====================================================================
   RENDERING
   ===================================================================== */
function show(view) {
  for (const v of ["joinView", "radioView"]) $(v).classList.toggle("hidden", v !== view);
}

function renderLangButtons() {
  const box = $("langButtons");
  box.innerHTML = "";
  for (const l of allLanguages()) {
    const b = document.createElement("button");
    b.className = "lang" + (l.code === S.lang ? " on" : "");
    b.textContent = l.label;
    b.addEventListener("click", () => { S.lang = l.code; renderLangButtons(); });
    box.appendChild(b);
  }
}

// Everyone on the channel, you first. The person talking gets a pulsing green chip.
function renderRoster() {
  const list = [...S.peers.values()].filter((p) => p.conn && p.conn.open)
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const people = [{ name: S.name, lang: S.lang, talking: S.transmitting, me: true }, ...list];
  $("rosterTitle").textContent = !S.joined ? "Connecting…" : `CH ${S.channel}`;
  $("rosterCount").textContent = S.joined ? `${people.length} ON` : "";
  const chips = $("chips");
  chips.innerHTML = "";
  for (const p of people) {
    const c = document.createElement("div");
    c.className = "chip" + (p.me ? " me" : "") + (p.talking ? " live" : "");
    c.innerHTML = `<span class="dot"></span><span class="nm">${esc(p.name || "?")}${p.me ? " (you)" : ""}</span><span class="lead"></span><span class="lg">${esc(langInfo(p.lang).short)}</span>`;
    chips.appendChild(c);
  }
  $("alone").classList.toggle("hidden", !S.joined || list.length > 0);

  const talk = $("talk");
  talk.disabled = S.listenOnly || !S.joined;
  talk.classList.toggle("on", S.transmitting);
  talk.innerHTML = S.listenOnly ? "NO MIC<small>LISTEN ONLY · SOLO ESCUCHAR</small>"
    : S.transmitting ? "SEND<small>TAP TO SEND · TOQUE PARA ENVIAR</small>"
    : "TALK<small>TAP TO TALK · TOQUE PARA HABLAR</small>";
  const led = $("busyLed");
  led.classList.toggle("tx", S.transmitting);
  led.classList.toggle("rx", !S.transmitting && list.some((p) => p.talking));
}

function setStatus(msg) {
  if (!msg || msg === "ON AIR") return;
  if (!S.joined) $("rosterTitle").textContent = /^CLAIMING/.test(msg) ? "Connecting… / Conectando…" : msg;
  else toast(msg.charAt(0) + msg.slice(1).toLowerCase());
}

function setCaption({ who = "", main = "", sub = "", badge = "" }) {
  $("capEmpty").classList.toggle("hidden", !!(who || main || sub));
  $("capWho").textContent = who;
  $("capMain").textContent = main;
  $("capSub").textContent = sub;
  if (badge) { const b = document.createElement("span"); b.className = "badge"; b.textContent = badge; $("capWho").appendChild(b); }
}

function addLog(entry) {
  S.log.unshift({ ...entry, time: new Date() });
  S.log.length = Math.min(S.log.length, CONFIG.captionLogSize);
  const box = $("log");
  box.innerHTML = "";
  // The newest entry is already in the big card; list the earlier ones.
  for (const e of S.log.slice(1)) {
    const d = document.createElement("div");
    d.className = "item" + (e.alarm ? " alarm" : "");
    const t = document.createElement("div"); t.className = "t";
    t.textContent = `${e.time.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · ${e.who || ""}`;
    const m = document.createElement("div"); m.className = "m"; m.textContent = e.main;
    d.append(t, m);
    if (e.sub) { const s = document.createElement("div"); s.className = "s"; s.textContent = e.sub; d.appendChild(s); }
    box.appendChild(d);
  }
}

function renderPresets() {
  const box = $("presets");
  box.classList.toggle("hidden", !CONFIG.showPresets);
  if (!CONFIG.showPresets) return;
  box.innerHTML = "";
  for (const p of CONFIG.presets) {
    const b = document.createElement("button");
    b.className = "preset" + (p.wide ? " wide" : "");
    b.style.background = p.color;
    b.textContent = `${p.icon} ${p.key}`;
    if (!p.verified) { const dot = document.createElement("span"); dot.className = "dot"; dot.title = "Unverified wording"; b.appendChild(dot); }
    b.addEventListener("click", () => sendPreset(p.key));
    box.appendChild(b);
  }
}

function renderDiag() {
  const parts = [
    `captions: ${currentEngine()}${S.sttConflict ? " (phone STT conflicted → server)" : ""}`,
    S.lastLatency != null ? `latency ${S.lastLatency} ms` : "",
  ].filter(Boolean);
  $("diag").textContent = parts.join(" · ");
}

function flashLcd() {
  const card = $("card");
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
}

let toastTimer;
function toast(msg, ms = 4000) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), ms);
}

/* =====================================================================
   AUDIO: tones, roger beep, speech output
   ===================================================================== */
function ensureAudioCtx() {
  if (!S.audioCtx) S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (S.audioCtx.state === "suspended") S.audioCtx.resume();
  return S.audioCtx;
}

function tone(freq, start, dur, gain = 0.15, type = "sine") {
  const ctx = ensureAudioCtx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.setValueAtTime(gain, t0 + dur - 0.02);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function rogerBeep() { tone(1400, 0, 0.07, 0.12); tone(1000, 0.08, 0.09, 0.12); }

// Returns ms until the tone is done, so speech can start after it.
function attentionTone(alarm) {
  if (alarm) {
    for (let i = 0; i < 3; i++) { tone(1800, i * 0.28, 0.12, 0.5, "square"); tone(1200, i * 0.28 + 0.13, 0.12, 0.5, "square"); }
    return 900;
  }
  tone(880, 0, 0.12, 0.25); tone(1320, 0.14, 0.18, 0.25);
  return 380;
}

function pickVoice(lang) {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const norm = (s) => String(s).replace("_", "-").toLowerCase();
  const want = norm(lang), base = want.split("-")[0];
  return voices.find((v) => norm(v.lang) === want)
    || voices.find((v) => norm(v.lang) === base + "-us")
    || voices.find((v) => norm(v.lang) === base + "-mx")
    || voices.find((v) => norm(v.lang).startsWith(base + "-") || norm(v.lang) === base)
    || null;
}

const someoneTalking = () => [...S.peers.values()].some((p) => p.talking) || S.transmitting;

// Translations wait their turn and never overlap; they also wait while anyone is keyed up.
function queueSpeech(text, lang) {
  if (!window.speechSynthesis) return;
  S.speechQueue.push({ text, lang });
  pumpSpeech();
}

function pumpSpeech() {
  if (S.speaking || !S.speechQueue.length || someoneTalking()) return;
  const item = S.speechQueue.shift();
  speakNow(item.text, item.lang, () => { S.speaking = false; pumpSpeech(); });
  S.speaking = true;
}

function speakNow(text, lang, done) {
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  if (v) u.voice = v;
  u.lang = v ? v.lang : lang;
  u.rate = 1.0;
  let finished = false;
  const finish = () => { if (!finished) { finished = true; done && done(); } };
  u.onend = finish; u.onerror = finish;
  setTimeout(finish, 1500 + text.length * 120); // some browsers never fire onend
  speechSynthesis.speak(u);
}

// Presets jump the queue.
function speakPriority(text, lang) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  S.speaking = true;
  speakNow(text, lang, () => { S.speaking = false; pumpSpeech(); });
}

/* =====================================================================
   RADIO CORE: mic, slot claiming, calls, data connections
   ===================================================================== */
async function setupMic() {
  const ctx = ensureAudioCtx();
  try {
    S.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    S.micTrack = S.micStream.getAudioTracks()[0];
    S.micTrack.enabled = false;
    S.outStream = S.micStream;
    S.listenOnly = false;
    S.analyser = ctx.createAnalyser();
    S.analyser.fftSize = 512;
    ctx.createMediaStreamSource(S.micStream).connect(S.analyser);
  } catch (e) {
    // Listen-only: send a silent track so calls still connect.
    S.outStream = ctx.createMediaStreamDestination().stream;
    S.listenOnly = true;
    toast("Mic blocked — listen-only mode. / Micrófono bloqueado — solo escuchar.");
  }
}

function slotId(n) { return `${CONFIG.peerPrefix}-${slug(S.channel)}-${n}`; }

function claimSlot(n) {
  if (n > CONFIG.maxSlots) { setStatus("CHANNEL FULL"); return; }
  setStatus(`CLAIMING SLOT ${n}…`);
  const peer = new Peer(slotId(n), CONFIG.peerOptions);
  peer.on("open", (id) => {
    S.peer = peer; S.myId = id; S.slot = n; S.joined = true;
    setStatus("ON AIR");
    renderRoster(); renderDiag();
    dialExisting();
  });
  peer.on("error", (err) => {
    if (err.type === "unavailable-id") { peer.destroy(); claimSlot(n + 1); return; }
    if (err.type === "peer-unavailable") {
      // Empty slot while dialing — expected. Abandon our pending dial to it.
      const m = /peer\s+(\S+)/i.exec(err.message || "");
      if (m) abandonDial(m[1].replace(/[^\w-]/g, ""));
      return;
    }
    setStatus(`ERR ${err.type}`.toUpperCase());
  });
  peer.on("disconnected", () => { if (S.joined && !peer.destroyed) { setStatus("RECONNECTING…"); peer.reconnect(); } });
  peer.on("call", (call) => onIncomingCall(call));
  peer.on("connection", (conn) => onIncomingConn(conn));
}

// Newcomer dials every other slot; existing peers never dial newcomers.
// A link only becomes the peer's active call/conn once it is live (stream / open), so a
// dial to an empty slot never blocks someone who claims that slot later.
function dialExisting() {
  for (let i = 1; i <= CONFIG.maxSlots; i++) {
    if (i === S.slot) continue;
    const id = slotId(i);
    const entry = getPeer(id);
    if (!entry.call && !entry.outCall) {
      entry.outCall = S.peer.call(id, S.outStream, { metadata: { name: S.name, lang: S.lang } });
      entry.outCall._init = S.myId;
      wireCall(entry.outCall, id);
    }
    if (!entry.conn && !entry.outConn) {
      entry.outConn = S.peer.connect(id, { reliable: true, metadata: { name: S.name, lang: S.lang } });
      entry.outConn._init = S.myId;
      wireConn(entry.outConn, id);
    }
  }
}

function getPeer(id) {
  if (!S.peers.has(id)) S.peers.set(id, { id, name: "", lang: "", call: null, conn: null, outCall: null, outConn: null, audio: null, talking: false });
  return S.peers.get(id);
}

function closeLink(l) { try { l && l.close(); } catch {} }

function dropPeer(id) {
  const p = S.peers.get(id);
  if (!p) return;
  S.peers.delete(id);
  for (const l of [p.call, p.conn, p.outCall, p.outConn]) closeLink(l);
  if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
  renderRoster();
  pumpSpeech();
}

function abandonDial(id) {
  const p = S.peers.get(id);
  if (!p) return;
  if (p.outCall && p.outCall !== p.call) closeLink(p.outCall);
  if (p.outConn && p.outConn !== p.conn) closeLink(p.outConn);
  p.outCall = p.outConn = null;
  if (!p.call && !p.conn) dropPeer(id);
}

// Make a live link the peer's active one. If two newcomers dialed each other and both links
// went live, both sides keep the one initiated by the lower peer id and close the other.
function adopt(entry, kind, link) {
  const cur = entry[kind];
  if (cur === link) return true;
  if (cur && cur.open) {
    const keepNew = link._init < cur._init;
    if (!keepNew) { closeLink(link); return false; }
    entry[kind] = link;
    closeLink(cur);
    return true;
  }
  entry[kind] = link;
  return true;
}

function onIncomingCall(call) {
  call._init = call.peer;
  getPeer(call.peer);
  call.answer(S.outStream);
  wireCall(call, call.peer);
}

function onIncomingConn(conn) {
  conn._init = conn.peer;
  getPeer(conn.peer);
  wireConn(conn, conn.peer);
}

function wireCall(call, id) {
  call.on("stream", (stream) => {
    const entry = getPeer(id);
    if (!adopt(entry, "call", call)) return;
    if (!entry.audio) {
      entry.audio = document.createElement("audio");
      entry.audio.autoplay = true;
      entry.audio.setAttribute("playsinline", "");
      document.body.appendChild(entry.audio);
    }
    entry.audio.srcObject = stream;
    entry.audio.play().catch(() => {});
  });
  call.on("close", () => {
    const e = S.peers.get(id);
    if (!e) return;
    if (e.outCall === call) e.outCall = null;
    if (e.call === call) dropPeer(id);
  });
  call.on("error", () => {});
}

function wireConn(conn, id) {
  conn.on("open", () => {
    const entry = getPeer(id);
    if (!adopt(entry, "conn", conn)) return;
    conn.send({ type: "hello", peerId: S.myId, name: S.name, lang: S.lang });
    renderRoster();
  });
  // Accept data on any link to this peer: the winning link can deliver before its own "open" fires here.
  conn.on("data", (msg) => onData(id, msg));
  conn.on("close", () => {
    const e = S.peers.get(id);
    if (!e) return;
    if (e.outConn === conn) e.outConn = null;
    if (e.conn === conn) dropPeer(id);
  });
  conn.on("error", () => {});
}

function broadcast(msg) {
  for (const p of S.peers.values()) if (p.conn && p.conn.open) { try { p.conn.send(msg); } catch {} }
}

function leaveChannel() {
  S.joined = false;
  for (const id of [...S.peers.keys()]) dropPeer(id);
  if (S.peer) { try { S.peer.destroy(); } catch {} }
  S.peer = null; S.myId = ""; S.slot = 0;
  if (S.micStream) S.micStream.getTracks().forEach((t) => t.stop());
  S.micStream = S.micTrack = S.outStream = null;
  show("joinView");
}

/* =====================================================================
   TALK (tap to start, tap again to send — names kept from the hold-to-talk version)
   ===================================================================== */
function pttDown() {
  if (S.transmitting || S.listenOnly || !S.joined) return;
  S.transmitting = true;
  if (window.speechSynthesis) speechSynthesis.cancel();
  S.speaking = false;
  S.micTrack.enabled = true;
  broadcast({ type: "ptt", on: true });
  renderRoster();
  startCapture();
  S.talkTimer = setTimeout(pttUp, CONFIG.maxTalkSeconds * 1000);
}

function pttUp() {
  if (!S.transmitting) return;
  S.transmitting = false;
  clearTimeout(S.talkTimer);
  S.micTrack.enabled = false;
  broadcast({ type: "ptt", on: false });
  rogerBeep();
  renderRoster();
  pumpSpeech();
  const releasedAt = performance.now();
  stopCapture().then((text) => sendTranscript(text, releasedAt)).catch(() => {});
}

/* =====================================================================
   TRANSLATION LAYER — capture (speech → text)
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Every iOS browser (Safari, Chrome, …) is WebKit; iPads can report as a Mac.
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function currentEngine() {
  if (S.sttMode === "off" || S.listenOnly) return "off";
  if (S.sttMode === "browser") return SR ? "browser" : "off";
  if (S.sttMode === "server") return window.MediaRecorder ? "server" : "off";
  // Set true once server captions work: iPhones then skip Apple's recognizer entirely.
  if (SR && !S.sttConflict && !(IS_IOS && CONFIG.iosServerCaptions)) return "browser";
  return window.MediaRecorder ? "server" : "off";
}

function startCapture() {
  const engine = currentEngine();
  const cap = { engine, started: performance.now(), peak: 0, finals: "", interim: "", rec: null, recorder: null, chunks: [], levelTimer: null };
  S.capture = cap;
  if (S.analyser) {
    const buf = new Float32Array(S.analyser.fftSize);
    cap.levelTimer = setInterval(() => {
      S.analyser.getFloatTimeDomainData(buf);
      for (const x of buf) cap.peak = Math.max(cap.peak, Math.abs(x));
    }, 100);
  }
  if (engine === "browser") {
    try {
      const rec = new SR();
      rec.lang = S.lang; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
      rec.onresult = (ev) => {
        let interim = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) cap.finals += r[0].transcript + " ";
          else interim += r[0].transcript;
        }
        cap.interim = interim;
        if (S.capture === cap) setCaption({ who: "YOU (LIVE)", main: (cap.finals + interim).trim() });
      };
      rec.onerror = (ev) => {
        cap.error = ev.error;
        if (["audio-capture", "not-allowed", "service-not-allowed"].includes(ev.error) && S.sttMode === "auto") markConflict(ev.error);
      };
      cap.ended = new Promise((res) => { rec.onend = res; });
      rec.start();
      cap.rec = rec;
    } catch { cap.engine = "off"; }
  } else if (engine === "server") {
    try {
      const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
      const recorder = new MediaRecorder(new MediaStream([S.micTrack]), mime ? { mimeType: mime } : undefined);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) cap.chunks.push(e.data); };
      cap.ended = new Promise((res) => { recorder.onstop = res; });
      recorder.start();
      cap.recorder = recorder;
    } catch { cap.engine = "off"; }
  }
}

async function stopCapture() {
  const cap = S.capture;
  if (!cap) return "";
  clearInterval(cap.levelTimer);
  const held = performance.now() - cap.started;
  let text = "";
  if (cap.rec) {
    try { cap.rec.stop(); } catch {}
    await Promise.race([cap.ended, new Promise((r) => setTimeout(r, 1500))]);
    text = (cap.finals + " " + cap.interim).trim();
    checkMicHealth(cap, held, text);
  } else if (cap.recorder) {
    try { cap.recorder.stop(); } catch {}
    await Promise.race([cap.ended, new Promise((r) => setTimeout(r, 1000))]);
    text = await serverTranscribe(cap);
  }
  if (S.capture === cap) S.capture = null;
  return text;
}

// Phone speech recognition can steal the mic from WebRTC (seen on iPhones). Signs:
// the radio track ended/muted, or recognition heard words while the radio track carried silence.
function checkMicHealth(cap, held, text) {
  const dead = !S.micTrack || S.micTrack.readyState === "ended" || S.micTrack.muted;
  const silentWhileHeard = S.analyser && held > 1200 && text && cap.peak < 0.004;
  if ((dead || silentWhileHeard) && S.sttMode !== "browser") markConflict(dead ? "track-ended" : "silent-track");
  if (dead) reacquireMic();
}

function markConflict(reason) {
  if (S.sttConflict) return;
  S.sttConflict = true;
  store.set("sttConflict", true);
  console.warn("STT/mic conflict:", reason);
  toast("This phone can't caption and transmit at once — switching captions to server mode.");
  renderDiag();
}

async function reacquireMic() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const track = s.getAudioTracks()[0];
    track.enabled = S.transmitting;
    for (const p of S.peers.values()) {
      const pc = p.call && p.call.peerConnection;
      if (!pc) continue;
      for (const sender of pc.getSenders()) if (sender.track === null || sender.track.kind === "audio") await sender.replaceTrack(track);
    }
    if (S.micTrack) S.micTrack.stop();
    S.micStream = s; S.micTrack = track; S.outStream = s;
    const ctx = ensureAudioCtx();
    S.analyser = ctx.createAnalyser(); S.analyser.fftSize = 512;
    ctx.createMediaStreamSource(s).connect(S.analyser);
  } catch {
    toast("Mic lost. Leave and rejoin the channel.");
  }
}

async function serverTranscribe(cap) {
  const blob = new Blob(cap.chunks, { type: (cap.recorder && cap.recorder.mimeType) || "audio/webm" });
  if (blob.size < 2000) return "";
  const audio = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.readAsDataURL(blob); });
  try {
    const data = await postJSON(CONFIG.translate.sttEndpoint, { id: uid(), lang: S.lang, mime: blob.type, audio }, CONFIG.translate.sttTimeoutMs);
    return clip(data.text, 600).trim();
  } catch { return ""; }
}


/* =====================================================================
   TRANSLATION LAYER — translate once on the sender, then broadcast
   ===================================================================== */
async function postJSON(url, body, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method: "POST", signal: ctrl.signal,
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "http_" + res.status);
    return data;
  } finally { clearTimeout(timer); }
}

async function sendTranscript(raw, releasedAt) {
  const text = clip(raw, 600).replace(/\s+/g, " ").trim();
  if (!text || text.replace(/[^\p{L}\p{N}]/gu, "").length < 2) {
    setCaption({ who: "You", main: "no caption", sub: "Your voice was sent. / Su voz fue enviada." });
    return;
  }
  const id = uid();
  const targets = [...new Set([...S.peers.values()].filter((p) => p.conn && p.conn.open && p.lang).map((p) => p.lang))]
    .filter((l) => l !== S.lang);
  setCaption({ who: "You said", main: text, sub: targets.length ? "translating…" : "" });

  let translations = {}, failed = false;
  if (targets.length) {
    try {
      const data = await postJSON(CONFIG.translate.endpoint, { id, text, from: S.lang, targets }, CONFIG.translate.timeoutMs);
      translations = data && data.translations && typeof data.translations === "object" ? data.translations : {};
      failed = targets.some((t) => !translations[t]);
    } catch { failed = true; }
  }
  const lat = Math.round(performance.now() - releasedAt);
  S.lastLatency = lat;
  broadcast({ type: "tx", id, from: S.name, srcLang: S.lang, text, translations, ts: Date.now(), lat });
  const cap = { who: "You said", main: text, sub: failed ? "(not translated)" : "" };
  setCaption(cap);
  addLog(cap);
  renderDiag();
}

/* =====================================================================
   TRANSLATION LAYER — receive
   ===================================================================== */
function onData(peerId, msg) {
  if (!msg || typeof msg !== "object") return;
  const p = getPeer(peerId);
  switch (msg.type) {
    case "hello":
      p.name = clip(msg.name, 20) || p.name;
      p.lang = clip(msg.lang, 16) || p.lang;
      renderRoster();
      break;
    case "ptt":
      p.talking = !!msg.on;
      if (!msg.on) rogerBeep();
      renderRoster();
      if (!msg.on) pumpSpeech();
      break;
    case "tx": onTx(p, msg); break;
    case "preset": onPreset(p, msg); break;
  }
}

function onTx(p, msg) {
  const src = clip(msg.srcLang, 16), text = clip(msg.text, 600);
  if (!text) return;
  const who = clip(msg.from, 20) || p.name || "Someone";
  const tr = msg.translations && typeof msg.translations === "object" ? clip(msg.translations[S.lang], 600) : "";
  let cap;
  if (src === S.lang) cap = { who, main: text, sub: "" };
  else if (tr) cap = { who, main: tr, sub: `Original: ${text}` };
  else cap = { who, main: text, sub: "(not translated)" };
  setCaption(cap);
  addLog(cap);
  if (typeof msg.lat === "number") { S.lastLatency = msg.lat; renderDiag(); }
  if (S.speak && tr && src !== S.lang) queueSpeech(tr, S.lang);
}

/* =====================================================================
   PRESETS (hidden unless CONFIG.showPresets)
   ===================================================================== */
function presetText(p, lang) {
  return p.text[lang] || p.text["en-US"] || p.key;
}

function sendPreset(key) {
  const p = presetByKey(key);
  if (!p) return;
  ensureAudioCtx();
  broadcast({ type: "preset", id: uid(), from: S.name, key, ts: Date.now() });
  attentionTone(p.alarm);
  if (p.alarm) flashLcd();
  const cap = { who: "You sent", main: `${p.icon} ${p.key}`, sub: presetText(p, S.lang), alarm: p.alarm };
  setCaption(cap);
  addLog(cap);
  if (navigator.vibrate) navigator.vibrate(60);
}

function onPreset(peer, msg) {
  const p = presetByKey(msg.key);
  if (!p) return;
  const waitMs = attentionTone(p.alarm);
  if (p.alarm) flashLcd();
  if (navigator.vibrate) navigator.vibrate(p.alarm ? [400, 150, 400, 150, 400] : [150]);
  const line = presetText(p, S.lang);
  const cap = { who: clip(msg.from, 20) || peer.name, main: `${p.icon} ${line}`, sub: p.key, alarm: p.alarm,
    badge: p.verified ? "" : "unverified" };
  setCaption(cap);
  addLog(cap);
  setTimeout(() => speakPriority(line, S.lang), waitMs);
}

/* =====================================================================
   WIRING
   ===================================================================== */
$("joinBtn").addEventListener("click", async () => {
  const name = $("joinName").value.trim();
  if (!name) { $("joinErr").textContent = "Type your name. / Escriba su nombre."; return; }
  $("joinErr").textContent = "";
  S.name = name;
  store.set("name", name); store.set("lang", S.lang);
  ensureAudioCtx();
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance("")); // unlock iOS speech
  await setupMic();
  show("radioView");
  renderRoster(); renderDiag();
  claimSlot(1);
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {}
});

$("changeBtn").addEventListener("click", () => { if (S.transmitting) pttUp(); leaveChannel(); renderLangButtons(); });

$("speakToggle").checked = S.speak;
$("speakToggle").addEventListener("change", (e) => {
  S.speak = e.target.checked; store.set("speak", S.speak);
  if (!S.speak && window.speechSynthesis) { S.speechQueue.length = 0; speechSynthesis.cancel(); }
});

// Tap once to start talking, tap again to send.
const talkTap = () => (S.transmitting ? pttUp() : pttDown());
$("talk").addEventListener("click", talkTap);

const typing = (e) => /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName);
document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && !typing(e) && S.joined) { e.preventDefault(); talkTap(); } });

// Remove any service worker or cache left by the old V3.5 radio at this address.
if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});

$("joinName").value = S.name;
$("joinChannel").textContent = CONFIG.channel;
renderLangButtons();
renderPresets();
setCaption({});
show("joinView");
</script>
